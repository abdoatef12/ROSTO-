
name: Inspect ROSTO Project

on:
  workflow_dispatch:
  push:
    paths:
      - 'rosto-android-1.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Inspect ZIP contents
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip -l rosto-android-1.zip
          mkdir -p extracted
          unzip -q rosto-android-1.zip -d extracted
          find extracted -maxdepth 3 -type f | head -100
