      - name: Extract and inspect project
        run: |
          unzip -q rosto-android-1.zip -d extracted
          find extracted -type f \( \
            -name gradlew -o \
            -name settings.gradle -o \
            -name settings.gradle.kts -o \
            -name build.gradle -o \
            -name build.gradle.kts \
          \)
