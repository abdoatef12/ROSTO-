name: ROSTO

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q rosto-android-1-1.zip -d extracted
          SETTINGS=$(find extracted -name settings.gradle | head -n1)
          echo "ROOT=$(dirname "$SETTINGS")" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: ${{ env.ROOT }}
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp ${{ env.ROOT }}/app/build/outputs/apk/debug/app-debug.apk ROSTO.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: ROSTO v1.${{ github.run_number }}
          files: ROSTO.apk
          make_latest: true
