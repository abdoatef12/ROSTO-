
name: Build ROSTO APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'rosto-android-1.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -q rosto-android-1.zip -d extracted
          find extracted -name gradlew -type f

      - name: Build APK
        run: |
          cd extracted
          GRADLEW=$(find . -name gradlew -type f | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "Gradle wrapper not found"
            exit 1
          fi
          cd "$(dirname "$GRADLEW")"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ROSTO-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
